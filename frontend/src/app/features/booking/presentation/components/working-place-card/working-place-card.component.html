<div class="working-place-card" (click)="this.onSelect.emit(this.workingPlace().id)">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title> {{this.workingPlace().name}}</mat-card-title>
    </mat-card-header>
    <img [src]="this.workingPlace().imageUrl" />
  </mat-card>
</div>
